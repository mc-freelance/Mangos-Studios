name: Tagged desktop releases

# Binary releases are intentionally not created from ordinary commits or PRs.
# Both the historical v.0.2.5-beta format and v1.2.3 are supported.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag and source
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source with Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate tag and commit relationship
        run: python scripts/release/package_release.py validate-tag --tag "${{ github.ref_name }}"

      - name: Test release packager
        run: python -m unittest discover -s tests -p 'test_release_packaging.py' -v

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          skip-lts-prepass: true
          check-latest: false

      - name: Restore and compile solution
        run: |
          dotnet restore MangosDatabaseStudio.sln
          dotnet build MangosDatabaseStudio.sln --configuration Release --no-restore
          dotnet test MangosDatabaseStudio.sln --configuration Release --no-build --no-restore

  package:
    name: Package ${{ matrix.rid }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Checkout tagged source with Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          skip-lts-prepass: true
          check-latest: false

      # Build on each native OS/CPU to ensure Photino's platform-specific
      # native dependencies are selected for that particular release.
      - name: Publish self-contained application and package assets
        shell: bash
        run: >-
          python scripts/release/package_release.py package
          --tag "${{ github.ref_name }}"
          --rid "${{ matrix.rid }}"
          --output .artifacts/release

      - name: Upload release asset and checksum
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            .artifacts/release/*.zip
            .artifacts/release/*.tar.gz
            .artifacts/release/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download all platform archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify all packages and checksums before release
        run: python scripts/release/package_release.py verify-assets --directory release-assets

      # A single release is created only after every platform build passes.
      # Prerelease Git tags produce prerelease GitHub releases automatically.
      - name: Attach precompiled packages to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MaNGOS Database Studio ${{ github.ref_name }}
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
